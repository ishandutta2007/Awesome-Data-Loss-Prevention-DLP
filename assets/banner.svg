<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1829"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>

    <!-- Accent linear gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="taglineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { opacity: 0.25; transform: scale(0.95); }
      50% { opacity: 0.55; transform: scale(1.08); }
      100% { opacity: 0.25; transform: scale(0.95); }
    }
    @keyframes pulseOrb2 {
      0% { opacity: 0.2; transform: scale(1.05); }
      50% { opacity: 0.45; transform: scale(0.92); }
      100% { opacity: 0.2; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-18px) translateX(10px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes sweepBeam {
      0% { transform: translateX(-150px); opacity: 0; }
      30% { opacity: 0.7; }
      70% { opacity: 0.7; }
      100% { transform: translateX(1350px); opacity: 0; }
    }
    @keyframes shieldPulse {
      0% { filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 26px rgba(56, 189, 248, 0.85)); }
      100% { filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4)); }
    }
    .orb1 { animation: pulseOrb 7s ease-in-out infinite; transform-origin: 200px 140px; }
    .orb2 { animation: pulseOrb2 8s ease-in-out infinite; transform-origin: 1000px 280px; }
    .p1 { animation: floatParticle 4s ease-in-out infinite; }
    .p2 { animation: floatParticle 5.5s ease-in-out infinite 1s; }
    .p3 { animation: floatParticle 4.5s ease-in-out infinite 2s; }
    .beam { animation: sweepBeam 6s linear infinite; }
    .shield-icon { animation: shieldPulse 4s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; }
  </style>

  <!-- Card Background with rounded corners -->
  <rect x="8" y="8" width="1184" height="404" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="8" y1="70" x2="1192" y2="70"/>
    <line x1="8" y1="140" x2="1192" y2="140"/>
    <line x1="8" y1="210" x2="1192" y2="210"/>
    <line x1="8" y1="280" x2="1192" y2="280"/>
    <line x1="8" y1="350" x2="1192" y2="350"/>
    <line x1="150" y1="8" x2="150" y2="412"/>
    <line x1="300" y1="8" x2="300" y2="412"/>
    <line x1="450" y1="8" x2="450" y2="412"/>
    <line x1="600" y1="8" x2="600" y2="412"/>
    <line x1="750" y1="8" x2="750" y2="412"/>
    <line x1="900" y1="8" x2="900" y2="412"/>
    <line x1="1050" y1="8" x2="1050" y2="412"/>
  </g>

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle class="orb1" cx="200" cy="140" r="160" fill="#0284c7" opacity="0.25" filter="url(#glow)"/>
  <circle class="orb2" cx="1000" cy="280" r="170" fill="#6366f1" opacity="0.2" filter="url(#glow)"/>
  <circle cx="600" cy="210" r="240" fill="#0369a1" opacity="0.12" filter="url(#glow)"/>

  <!-- Scanning dynamic light beam across top line -->
  <line class="beam" x1="0" y1="8" x2="160" y2="8" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>

  <!-- Floating Ambient Particles -->
  <circle class="p1" cx="180" cy="90" r="3" fill="#38bdf8"/>
  <circle class="p2" cx="1040" cy="120" r="3.5" fill="#818cf8"/>
  <circle class="p3" cx="940" cy="340" r="2.5" fill="#38bdf8"/>
  <circle class="p1" cx="120" cy="320" r="2.5" fill="#67e8f9"/>
  <circle class="p2" cx="640" cy="80" r="2" fill="#bae6fd"/>

  <!-- FOREGROUND CONTENT: Guaranteed distinct and unhidden -->

  <!-- Top Badge: Curated Standard -->
  <g transform="translate(460, 48)">
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <text x="32" y="19" fill="#bae6fd" font-size="12" font-family="-apple-system, sans-serif" font-weight="700" letter-spacing="1.5">DATA LOSS PREVENTION (DLP)</text>
  </g>

  <!-- Center Shield Icon -->
  <g class="shield-icon" transform="translate(565, 96)">
    <!-- Shield graphic -->
    <path d="M35 0 L68 14 C68 45 52 72 35 84 C18 72 2 45 2 14 Z" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="3.5"/>
    <path d="M35 12 L56 22 C56 46 45 64 35 72 C25 64 14 46 14 22 Z" fill="#0284c7" fill-opacity="0.25"/>
    <!-- Keyhole/Lock -->
    <circle cx="35" cy="38" r="7" fill="#38bdf8"/>
    <path d="M32 43 L38 43 L40 54 L30 54 Z" fill="#38bdf8"/>
  </g>

  <!-- Main Title -->
  <text class="title-text" x="600" y="235" text-anchor="middle" font-size="46" fill="url(#titleGrad)" letter-spacing="-0.5">
    Awesome Data Loss Prevention
  </text>

  <!-- Subtitle Tagline -->
  <text class="desc-text" x="600" y="278" text-anchor="middle" font-size="18" fill="#94a3b8" letter-spacing="0.5">
    Enterprise SaaS &amp; Open-Source Defense Against Sensitive Data Exfiltration
  </text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(130, 318)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="205" height="42" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.6"/>
      <text class="pill-text" x="102" y="26" text-anchor="middle" fill="#7dd3fc">🛡️ Endpoint &amp; USB DLP</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="220" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <text class="pill-text" x="110" y="26" text-anchor="middle" fill="#7dd3fc">🔍 Automated PII &amp; PHI</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(495, 0)">
      <rect x="0" y="0" width="215" height="42" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <text class="pill-text" x="107" y="26" text-anchor="middle" fill="#c7d2fe">🤖 GenAI &amp; Agent Egress</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(745, 0)">
      <rect x="0" y="0" width="195" height="42" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.6"/>
      <text class="pill-text" x="97" y="26" text-anchor="middle" fill="#7dd3fc">☁️ Cloud SASE &amp; CASB</text>
    </g>
  </g>
</svg>
